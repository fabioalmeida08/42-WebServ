# Config de demonstracao: duas portas com roots diferentes.
# Mostra que o servidor atende varios servers ao mesmo tempo (cada um
# com o seu proprio root e autoindex).
server {
    listen              8081;
    server_name         localhost;

    client_max_body_size 1M;

    error_page          400 /errors/400.html;
    error_page          403 /errors/403.html;
    error_page          404 /errors/404.html;
    error_page          405 /errors/405.html;
    error_page          413 /errors/413.html;
    error_page          500 /errors/500.html;
    error_page          501 /errors/501.html;
    error_page          502 /errors/502.html;
    error_page          504 /errors/504.html;

    # Porta 8081: serve o site principal, com autoindex ligado em /files
    location / {
        root            www;
        index           index.html;
        methods         GET HEAD;
        autoindex       off;
    }

    location /files {
        root            www/files;
        methods         GET HEAD;
        autoindex       on;
    }

    location /antigo {
        redirect        301 /files/exemplo.txt;
        methods         GET HEAD;
    }
}

server {
    listen              8082;
    server_name         alternativo;

    client_max_body_size 1M;

    error_page          404 /errors/404.html;
    error_page          405 /errors/405.html;

    # Porta 8082: outro root inteiramente diferente (www2) e com o
    # autoindex ligado na raiz
    location / {
        root            www2;
        index           index.html;
        methods         GET HEAD;
        autoindex       on;
    }

    location /upload {
        root            www2/upload;
        methods         GET HEAD POST DELETE;
        upload_store    www2/upload;
        autoindex       on;
    }
}
