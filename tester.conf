# Configuracao para o tester oficial da 42:
#
#     cp /caminho/do/cgi_tester cgi_test
#     ./bin/webserv tester.conf
#     /home/fabio/code/tester http://127.0.0.1:8080/
#
# O tester exige exatamente isto:
#   - /                        -> SOMENTE GET
#   - qualquer *.bla           -> POST, chamando o executavel cgi_test
#   - /post_body               -> aceita POST com maxBody 100
#   - /directory/              -> GET com root YoupiBanane e, sem arquivo na
#                                 URL, serve o arquivo youpi.bad_extension
server {
    listen              8080;
    server_name         localhost;

    client_max_body_size 100M;

    error_page          400 /errors/400.html;
    error_page          403 /errors/403.html;
    error_page          404 /errors/404.html;
    error_page          405 /errors/405.html;
    error_page          411 /errors/411.html;
    error_page          413 /errors/413.html;
    error_page          414 /errors/414.html;
    error_page          431 /errors/431.html;
    error_page          500 /errors/500.html;
    error_page          501 /errors/501.html;
    error_page          502 /errors/502.html;
    error_page          503 /errors/503.html;
    error_page          504 /errors/504.html;
    error_page          505 /errors/505.html;

    location / {
        root                www;
        index               index.html;
        methods             GET;
    }

    location /post_body {
        root                www;
        methods             POST;
        upload_store        www/upload;
        client_max_body_size 100;
    }

    location /directory {
        root                YoupiBanane;
        index               youpi.bad_extension;
        methods             GET POST;
        cgi                 .bla cgi_test;
    }
}
