<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 Internal Server Error</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:#0b0d12;color:#e6e9ef;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 20% 0%,rgba(255,107,129,.14),transparent 45%)}
.box{max-width:560px;width:100%}
.code{font:800 clamp(90px,22vw,170px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-6px;
  background:linear-gradient(135deg,#ff6b81,#ffcc66);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:24px;margin:8px 0 10px}
p{color:#8a93a6}
pre{margin:24px 0;background:#12161f;border:1px solid #232a38;border-radius:10px;padding:14px;
  font:13px ui-monospace,Menlo,Consolas,monospace;color:#c9d1e0;overflow-x:auto}
pre span{color:#ff6b81}
a{display:inline-block;padding:10px 16px;border-radius:8px;background:#7cf0c4;color:#06281c;
  font-weight:700;font-size:14px;text-decoration:none}
a.ghost{background:transparent;color:#e6e9ef;border:1px solid #232a38;margin-left:8px}
small{display:block;margin-top:28px;color:#4b5468;font:12px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="box">
  <div class="code">500</div>
  <h1>Internal Server Error</h1>
  <p>Algo deu errado do nosso lado ao processar a requisição.</p>
  <pre>HTTP/1.1 <span>500 Internal Server Error</span></pre>
  <a href="/">Voltar ao início</a><a class="ghost" href="javascript:history.back()">Página anterior</a>
  <small>webserv · 42</small>
</div>
</body>
</html>
